name: snake-robot

x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  ROS_LOCALHOST_ONLY: "0"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

x-common: &common
  network_mode: host
  ipc: host
  init: true
  restart: unless-stopped

services:
  control:
    <<: *common
    image: ${IMAGE_REGISTRY:?请在 .env 中设置 IMAGE_REGISTRY}/snake-control:${IMAGE_TAG:-jazzy}
    container_name: snake-control
    environment:
      <<: *ros-environment
      SERIAL_DEVICE: ${SERIAL_DEVICE:-/dev/ttyUSB0}
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}"
    group_add:
      - "${DIALOUT_GID:-20}"
    command: ["sleep", "infinity"]

  autonomy:
    <<: *common
    image: ${IMAGE_REGISTRY:?请在 .env 中设置 IMAGE_REGISTRY}/snake-autonomy:${IMAGE_TAG:-jazzy}
    container_name: snake-autonomy
    environment:
      <<: *ros-environment
    depends_on:
      - control
    command: ["sleep", "infinity"]

  monitoring:
    <<: *common
    image: ${IMAGE_REGISTRY:?请在 .env 中设置 IMAGE_REGISTRY}/snake-monitoring:${IMAGE_TAG:-jazzy}
    container_name: snake-monitoring
    environment:
      <<: *ros-environment
    depends_on:
      - control
      - autonomy
    command:
      - ros2
      - launch
      - foxglove_bridge
      - foxglove_bridge_launch.xml
      - address:=0.0.0.0
      - port:=8765
