# Compose 统一编排控制、导航和监控三个 Stack。
name: snake-robot

# 定义三个容器共用的 ROS 2 环境变量。
# 使用 YAML anchor，避免在每个服务中重复填写。
x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  ROS_LOCALHOST_ONLY: "0"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

# 定义三个容器共用的运行参数。
x-common: &common
  # ROS 2 DDS 使用 UDP 组播发现节点。
  # host 网络能减少 Docker NAT 对节点发现的影响。
  network_mode: host
  # 允许容器使用宿主机 IPC，
  # 对部分 DDS 共享内存传输方式更友好。
  ipc: host
    # Docker 停止容器时使用 init 正确处理子进程和退出信号。
  init: true

  # 除非用户主动停止，否则异常退出后自动重启。
  restart: unless-stopped

  # 为调试保留终端输入能力。
  stdin_open: true
  tty: true


services:
  # 控制栈负责 MCU 通信、关节状态、步态控制和安全保护。
  control:
    <<: *common

    # 使用仓库根目录作为构建上下文。
    # 因为 Dockerfile 需要读取根目录中的 ROS-Packages。
    build:
      context: ..
      dockerfile: Stacks/control/Dockerfile

    # 构建完成后的镜像名称。
    image: snake-control:jazzy

    # 固定容器名称，方便使用 docker logs 和 docker exec。
    container_name: snake-control

    # 加载上面定义的公共 ROS 2 环境变量。
    environment:
      <<: *ros-environment

      # 将串口设备路径传给控制节点。
      SERIAL_DEVICE: ${SERIAL_DEVICE:-/dev/ttyUSB0}
    # 把宿主机串口映射到容器内部。
    # 左侧是宿主机设备，右侧是容器内设备。
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}"

    # 将容器用户加入串口设备所属的 dialout 组。
    # 默认 GID 20，具体值可在 .env 中覆盖。
    group_add:
      - "${DIALOUT_GID:-20}"
    


    # 当前还没有正式的控制启动文件，
    # 所以先保持容器运行，方便进入容器调试。
    command: ["sleep", "infinity"]

    # 控制节点完成后，可以将上面的 command 替换为：
    # command:
    #   - ros2
    #   - launch
    #   - snake_bringup
    #   - hardware.launch.py


  # 自主栈负责目标导航、路径规划和运动命令生成。
  autonomy:
    <<: *common

    # 使用自主导航 Stack 的 Dockerfile。
    build:
      context: ..
      dockerfile: Stacks/autonomy/Dockerfile

    # 自主导航镜像名称。
    image: snake-autonomy:jazzy

    # 自主导航容器名称。
    container_name: snake-autonomy

    # 使用相同的 ROS_DOMAIN_ID 和 DDS 实现，
    # 保证它能发现 control 容器里的节点。
    environment:
      <<: *ros-environment

    # 表示启动顺序上先启动 control。
    # 注意：depends_on 只保证容器启动顺序，
    # 不保证控制节点已经完全初始化。
    depends_on:
      - control

    # 当前导航包没有正式 launch 文件，
    # 暂时保持容器运行。
    command: ["sleep", "infinity"]

    # 导航节点完成后，可以替换为：
    # command:
    #   - ros2
    #   - launch
    #   - snake_navigation
    #   - navigation.launch.py
  # Monitoring 栈负责 Foxglove Bridge、遥测和诊断数据显示。
  monitoring:
    <<: *common

    # 使用监控 Stack 的 Dockerfile。
    build:
      context: ..
      dockerfile: Stacks/monitoring/Dockerfile

    # 监控镜像名称。
    image: snake-monitoring:jazzy

    # 监控容器名称。
    container_name: snake-monitoring

    # 使用与另外两个容器相同的 ROS 2 通信配置。
    environment:
      <<: *ros-environment

    # 先启动控制和自主导航容器，
    # 再启动监控容器。
    depends_on:
      - control
      - autonomy

    # 启动 Foxglove Bridge。
    # 0.0.0.0 允许宿主机及局域网设备连接。
    # 默认 WebSocket 端口为 8765。
    command:
      - ros2
      - launch
      - foxglove_bridge
      - foxglove_bridge_launch.xml
      - address:=0.0.0.0
      - port:=8765
