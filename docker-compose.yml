x-snake-common: &snake-common
  build:
    context: .
    dockerfile: Docker/Dockerfile
    args:
      USER_NAME: ${CONTAINER_USER:-snake}
      USER_UID: ${HOST_UID:-1000}
      USER_GID: ${HOST_GID:-1000}
  image: snake-robot:jazzy
  network_mode: host
  ipc: host
  init: true
  tty: true
  stdin_open: true
  working_dir: /workspace/ros2_snake/ros2_ws
  environment:
    DISPLAY: ${DISPLAY:-:0}
    QT_X11_NO_MITSHM: "1"
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    SNAKE_ROS_WS: /workspace/ros2_snake/ros2_ws
  volumes:
    - .:/workspace/ros2_snake
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  group_add:
    - ${DIALOUT_GID:-20}

services:
  snake-dev:
    <<: *snake-common
    container_name: snake-robot-dev
    command: ["sleep", "infinity"]

  snake-hardware:
    <<: *snake-common
    container_name: snake-robot-hardware
    profiles: ["hardware"]
    devices:
      - ${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}
    command: ["sleep", "infinity"]
